<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Dashboard Control Member Mitra10</title><style id="sty">

[hidden]{display:none!important}
.act{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;margin-top:4px}.act>div:first-child{display:flex;flex-direction:column;gap:8px;align-items:flex-start}.tp{flex:1;min-width:280px;margin-top:0}.ti{display:grid;grid-template-columns:20px 1fr auto;gap:8px;font-size:12.5px;padding:5px 0;border-top:1px solid var(--bd)}.ti small{color:var(--mu)}.ti em{font-style:normal;text-align:right}

.pb{height:8px;border-radius:5px;background:var(--bd);overflow:hidden}.pb i{display:block;height:100%;background:var(--wa)}
.pr{display:grid;grid-template-columns:130px 1fr 130px;gap:8px;align-items:center;margin:6px 0;font-size:12.5px}.pr em{font-style:normal;text-align:right}
.zb{cursor:pointer;border-radius:6px}.zb:hover{background:color-mix(in srgb,var(--ac2) 10%,transparent)}.zb.on{outline:2px solid var(--ac2)}
.nt{background:color-mix(in srgb,var(--ac) 12%,transparent);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;margin-bottom:10px;font-size:12.5px}
.rk{min-width:0}.rk td,.rk th{padding:6px 10px}.rk small{color:var(--mu)}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--tx) 3%,transparent)}.k b{font-size:22px}
.wb{display:inline-block;background:var(--wa);color:#fff;padding:7px 14px;border-radius:8px;text-decoration:none;font-weight:600}

[hidden]{display:none!important}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#gate .box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:22px;width:100%;max-width:380px}
#gate h1{font-size:18px;margin:0 0 4px}#gate p{color:var(--mu);margin:0 0 14px;font-size:13px}

#who{float:right;font-size:12px;color:var(--mu)}#who a{color:var(--ac2)}
</style></head><body><div id="gate"><div class="box"><h1>Dashboard Control Member Mitra10</h1><p>Masuk dengan akun tim untuk melihat data.</p><form id="lf" hidden><input id="le" type="email" placeholder="Email" autocomplete="username" required><input id="lp" type="password" placeholder="Password" autocomplete="current-password" required><button id="lb" type="submit">Masuk</button></form><div id="gm">Memuat…</div><button id="lo2" hidden style="margin-top:10px">Keluar &amp; ganti akun</button></div></div><div id="root" hidden>
<header><span id="who"></span><h1>Dashboard Control Member Mitra10</h1><p id="lu"></p></header>
<main>
<div class="kpis" id="kp"></div>
<div class="nt" id="nt" hidden></div>
<div class="chips" id="ch"></div>
<div class="sm" id="sm"></div>
<div class="bar"><input id="q" placeholder="Cari No Member / nama / no HP…"><select id="fp"></select><select id="fz"></select><select id="fk"><option value="">Semua Ket Pareto</option><option value="1">Pareto</option><option value="0">No</option></select><select id="fs"><option value="">Semua Status Follow-up</option><option value="0">Belum difollowup</option><option value="1">Sudah difollowup</option></select><button id="up">⬆ Upload data</button><input type="file" id="fi" accept=".xlsx,.json,.gz" hidden=""></div>
<div class="tw"><table><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table></div>
<div class="pg"><span id="inf"></span><span><button id="pv">‹ Prev</button> <button id="nx">Next ›</button></span></div>
</main>
<div id="ov"><div class="md" id="md"></div></div>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
function boot(D){const CAT=D.c;const BLN=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const R=D.r,S=D.s,$=id=>document.getElementById(id);
const N=new Intl.NumberFormat("id-ID"),rp=v=>"Rp "+N.format(Math.round(v));
const cp=v=>{const a=Math.abs(v);return a>=1e9?(v/1e9).toFixed(2).replace(".",",")+" M":a>=1e6?(v/1e6).toFixed(1).replace(".",",")+" jt":N.format(Math.round(v))};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pic=r=>r[5]<0?["–","Belum ada PIC"]:S[r[5]];
const wa=p=>{p=String(p).replace(/\D/g,"");if(p[0]==="0")p="62"+p.slice(1);else if(p.slice(0,2)!=="62")p="62"+p;return "https://wa.me/"+p};
const COLS=[["PIC Salper ID",r=>pic(r)[0],0],["PIC Salper Name",r=>pic(r)[1],0],["No Member",r=>r[0],0],["Nama Customer",r=>r[1],0],["No WA",r=>r[2],0],["Sales YTD",r=>r[3],1],["Ket Pareto",r=>r[4],0],["Follow-up",r=>fd(r)?1:0,0]];
let sk=5,sd=-1,pg=0,F=R,BASE=R,CHS=[],RS="pb",SHALL=false;const PS=50;let FU={},uid=ME.email,canW=ROLE==="editor"||ROLE==="contributor",cur=null,wq=Promise.resolve();R.forEach((r,i)=>r[10]=i);const bk=n=>"b"+(Number(String(n).slice(-5))%100);const fd=r=>FU["m"+r[0]]?.s===1;
$("th").innerHTML=COLS.map((c,i)=>`<th class="${c[2]?"n":""}" data-i="${i}">${c[0]}</th>`).join("");
$("fp").innerHTML='<option value="">Semua PIC Salper</option><option value="-2">Belum ada PIC</option>'+S.map((s,i)=>`<option value="${i}">${esc(s[1])} (${s[0].split("-")[1]})</option>`).join("");
const zs=[...new Set(R.map(r=>r[6]))].sort();$("fz").innerHTML='<option value="">Semua Zone</option>'+zs.map(z=>`<option>${z}</option>`).join("");
function filt(){const q=$("q").value.trim().toLowerCase(),p=$("fp").value,z=$("fz").value,k=$("fk").value,s=$("fs").value;
const pass=(r,sp)=>(!q||r[0].includes(q)||r[1].toLowerCase().includes(q)||r[2].includes(q))&&(sp||p===""||(p==="-2"?r[5]<0:r[5]==p))&&(z===""||r[6]==z)&&(k===""||r[4]==k)&&(s===""||(s==="1")===fd(r));BASE=R.filter(r=>pass(r,1));F=p===""?BASE:BASE.filter(r=>pass(r,0));
const c=COLS[sk][1];F.sort((a,b)=>{const x=c(a),y=c(b);return (x>y?1:x<y?-1:0)*sd});pg=0;draw();summary()}
function draw(){const t=F.length,m=Math.max(0,Math.ceil(t/PS)-1);pg=Math.min(pg,m);
$("tb").innerHTML=F.slice(pg*PS,pg*PS+PS).map(r=>{const p=pic(r),d=fd(r);return `<tr data-i="${r[10]}"><td data-label="PIC Salper ID">${p[0]}</td><td data-label="PIC Salper Name">${esc(p[1])}</td><td class="mn" data-label="No Member">${r[0]}</td><td data-label="Nama Customer">${esc(r[1])}</td><td data-label="No WA"><a class="wa" target="_blank" rel="noopener" href="${wa(r[2])}">${r[2]}</a></td><td class="n" data-label="Sales YTD">${rp(r[3])}</td><td data-label="Ket Pareto"><span class="tag p${r[4]}">${r[4]?"Pareto":"No"}</span></td><td data-label="Follow-up"><button class="fu ${d?"on":""}" data-m="${r[10]}" ${canW?"":'disabled title="Perlu akses Contributor/Editor untuk mengubah status"'}>${d?"✓ Sudah":"Belum"}</button></td></tr>`}).join("");
$("inf").textContent=`${N.format(t)} member · halaman ${pg+1}/${m+1}`;$("pv").disabled=pg==0;$("nx").disabled=pg>=m;
const sum=F.reduce((a,r)=>a+r[3],0),pa=F.filter(r=>r[4]).length,wp=F.filter(r=>r[5]>=0).length,dn=F.filter(fd).length;
$("kp").innerHTML=[["Member (filter)",N.format(t)],["Sales YTD","Rp "+cp(sum)],["Member Pareto",N.format(pa)],["Sudah difollowup",N.format(dn)+" ("+(t?Math.round(dn/t*100):0)+"%)"],["Sudah ada PIC",N.format(wp)+" ("+(t?Math.round(wp/t*100):0)+"%)"]].map(x=>`<div class="k"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")}
function top5(r){const e=(D.t||[])[r[10]]||[];const h='<div class="cd tp"><h3>5 Item Pareto (nilai belanja terbesar)</h3>';
if(!e.length)return h+'<span style="color:var(--mu)">Belum ada data item untuk member ini.</span></div>';
return h+e.map((x,k)=>{const it=D.i[x[0]]||["",""],sh=r[3]>0?Math.round(x[2]/r[3]*100):0;return `<div class="ti"><span>${k+1}</span><span>${esc(it[1])}<br><small>${esc(it[0])} \u00b7 qty ${N.format(x[1])}</small></span><em>${rp(x[2])}<br><small>${sh}% sales</small></em></div>`}).join("")+'</div>'}
function fn5(r){const e=(D.g||[])[r[10]]||[],h='<div class="cd"><h3>5 Pareto by Function</h3>';if(!e.length)return h+'<span style="color:var(--mu)">Belum ada data function.</span></div>';
const mx=Math.max(e[0][1],1);return h+e.map((x,k)=>`<div class="hb"><span>${k+1}. ${esc((D.f||[])[x[0]]||"-")}</span><div><i style="width:${Math.max(0,x[1])/mx*100}%"></i></div><em>${cp(x[1])}</em></div>`).join("")+'</div>'}
function lastBuy(r){const w=(D.w||[])[r[10]]||[],d=w[11];if(!d)return "–";const y=Math.floor(d/10000),m=Math.floor(d/100)%100,dd=d%100,n=Math.max(0,Math.round((Date.now()-new Date(y,m-1,dd))/864e5));return `${dd} ${BLN[m-1]} ${y} <small style="display:inline;color:var(--mu)">(${N.format(n)} hari lalu)</small>`}
function habit(r){const w=(D.w||[])[r[10]]||[],h='<div class="cd"><h3>Kebiasaan belanja: Weekday vs Weekend</h3>';if(!w.length)return h+'<span style="color:var(--mu)">Belum ada data hari belanja.</span></div>';
const wd=w[0],we=w[1],td=wd+we,sd=w[2],se=w[3],ts=sd+se,pc=(a,b)=>b>0?Math.round(a/b*100):0,DY=["Sen","Sel","Rab","Kam","Jum","Sab","Min"],dm=Math.max(...w.slice(4,11),1),lb=we>wd?"Lebih sering belanja di Weekend":wd>we?"Lebih sering belanja di Weekday":"Weekday dan Weekend seimbang";
return h+`<div style="font-size:17px;font-weight:700">${lb}</div><div style="color:var(--mu);font-size:12.5px;margin-bottom:6px">${td} hari belanja: ${wd} weekday (${pc(wd,td)}%) · ${we} weekend (${pc(we,td)}%)</div>
<div class="hb"><span>Weekday</span><div><i style="width:${pc(wd,td)}%"></i></div><em>${cp(sd*1000)} (${pc(sd,ts)}%)</em></div><div class="hb"><span>Weekend</span><div><i style="width:${pc(we,td)}%;background:var(--ac)"></i></div><em>${cp(se*1000)} (${pc(se,ts)}%)</em></div>
<div style="color:var(--mu);font-size:11.5px">Bar = proporsi hari belanja · angka = nilai belanja (% dari total)</div>
<div class="vc" style="height:80px;margin-top:8px">${w.slice(4,11).map((v,i)=>`<div title="${DY[i]}: ${v} hari"><span>${v}</span><i style="height:${v/dm*70}%;background:${i>4?"var(--ac)":"var(--ac2)"}"></i><span>${DY[i]}</span></div>`).join("")}</div></div>`}
function summary(){const B=BASE,T=B.length,dn=B.filter(fd).length,pr=B.filter(r=>r[4]),wp=B.filter(r=>r[5]>=0),pc=(a,b)=>b?Math.round(a/b*100):0,f=[$("fp").value,$("fz").value,$("fk").value,$("fs").value,$("q").value];
CHS=[["Semua",()=>!f[0]&&!f[1]&&!f[2]&&!f[3]&&!f[4],()=>{["fp","fz","fk","fs"].forEach(i=>$(i).value="");$("q").value=""}],["Pareto belum difollowup",()=>f[2]==="1"&&f[3]==="0",()=>{$("fk").value="1";$("fs").value="0"}],["Belum difollowup",()=>f[3]==="0"&&f[2]==="",()=>{$("fk").value="";$("fs").value="0"}],["Sudah difollowup",()=>f[3]==="1",()=>{$("fs").value="1"}],["Belum ada PIC",()=>f[0]==="-2",()=>{$("fp").value="-2"}]];
$("ch").innerHTML=CHS.map((c,i)=>`<button class="chip ${c[1]()?"on":""}" data-c="${i}">${c[0]}</button>`).join("");
const row=(l,a,b)=>`<div class="pr"><span>${l}</span><div class="pb"><i style="width:${pc(a,b)}%"></i></div><em>${N.format(a)} / ${N.format(b)} (${pc(a,b)}%)</em></div>`;
const zm=new Map();B.forEach(r=>zm.set(r[6],(zm.get(r[6])||0)+r[3]));const zl=[...zm].sort((a,b)=>b[1]-a[1]).slice(0,8),zx=Math.max(...zl.map(x=>x[1]),1);
const g=new Map();B.forEach(r=>{let e=g.get(r[5]);if(!e){e={k:r[5],n:0,par:0,pd:0,s:0,d:0};g.set(r[5],e)}e.n++;e.s+=r[3];if(fd(r)){e.d++;if(r[4])e.pd++}if(r[4])e.par++});
let L=[...g.values()];L.sort(RS==="s"?(a,b)=>b.s-a.s:RS==="lo"?(a,b)=>pc(a.d,a.n)-pc(b.d,b.n):(a,b)=>(b.par-b.pd)-(a.par-a.pd));const tot=L.length;if(!SHALL)L=L.slice(0,10);
$("sm").innerHTML=`<div class="cd"><h3>Progres follow-up</h3>${row("Semua member",dn,T)}${row("Member Pareto",pr.filter(fd).length,pr.length)}${row("Member punya PIC",wp.filter(fd).length,wp.length)}<small style="color:var(--mu)">Mengikuti filter di bawah, kecuali filter PIC.</small></div>
<div class="cd"><h3>Sales YTD per Zone <small style="color:var(--mu)">(klik untuk filter)</small></h3>${zl.map(x=>`<div class="hb zb ${$("fz").value===x[0]?"on":""}" data-z="${esc(x[0])}"><span>${x[0]==="-"?"Tanpa Zone":"Zone "+esc(x[0])}</span><div><i style="width:${Math.max(0,x[1])/zx*100}%"></i></div><em>${cp(x[1])}</em></div>`).join("")}</div>
<div class="cd wide"><h3 style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px"><span>Rekap per PIC <small style="color:var(--mu)">(klik baris untuk filter)</small></span> <select id="rs"><option value="pb" ${RS==="pb"?"selected":""}>Urut: Pareto belum difollowup</option><option value="lo" ${RS==="lo"?"selected":""}>Urut: progres follow-up terendah</option><option value="s" ${RS==="s"?"selected":""}>Urut: Sales YTD</option></select></h3>
<div class="tw"><table class="rk"><thead><tr><th>PIC Salper</th><th class="n">Member</th><th class="n">Pareto</th><th class="n">Pareto belum</th><th class="n">Sales YTD</th><th>Progres follow-up</th></tr></thead><tbody>${L.map(e=>`<tr class="zr" data-p="${e.k<0?-2:e.k}"><td data-label="PIC">${e.k<0?"Belum ada PIC":esc(S[e.k][1])}</td><td class="n" data-label="Member">${N.format(e.n)}</td><td class="n" data-label="Pareto">${e.par}</td><td class="n" data-label="Pareto belum difollowup" style="${e.par-e.pd?"color:var(--ac);font-weight:600":""}">${e.par-e.pd}</td><td class="n" data-label="Sales YTD">${cp(e.s)}</td><td data-label="Progres"><div class="pr" style="grid-template-columns:1fr 60px;margin:0"><div class="pb"><i style="width:${pc(e.d,e.n)}%"></i></div><em>${pc(e.d,e.n)}%</em></div></td></tr>`).join("")}</tbody></table></div>${tot>10?`<button id="rmore" style="margin-top:8px">${SHALL?"Tampilkan 10 teratas":"Tampilkan semua ("+tot+" PIC)"}</button>`:""}</div>`}
$("ch").onclick=e=>{const b=e.target.closest(".chip");if(b){CHS[b.dataset.c][2]();filt()}};

const DATA_FILE="dashboard.json.gz";
function emptyData(){const d=new Date(),at=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");return {s:[],r:[],c:[],i:[],t:[],f:[],g:[],w:[],u:[{at,per:"–",file:"–",n:0,pic:0,par:0,sales:0}]}}
async function start(){
  const C=window.CFG||{};
  if(!C.SUPABASE_URL||!C.SUPABASE_ANON_KEY||!window.supabase){showGate(false,"Dashboard belum dikonfigurasi. Isi SUPABASE_URL dan SUPABASE_ANON_KEY di file config.js (lihat README).");return}
  SB=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
  const {data:{session}}=await SB.auth.getSession();
  if(!session){showGate(true,"");return}
  ME={email:String(session.user.email||"").toLowerCase()};
  showGate(false,"Memeriksa akses…");
  const {data:tim,error:te}=await SB.from("tim").select("email,nama,peran");
  if(te){showGate(false,"Gagal memeriksa akses: "+te.message);return}
  (tim||[]).forEach(t=>{NAMES[String(t.email).toLowerCase()]=t.nama||t.email});
  ROLE=((tim||[]).find(t=>String(t.email).toLowerCase()===ME.email)||{}).peran||null;
  if(!ROLE){showGate(false,"Email "+ME.email+" belum terdaftar di tim dashboard. Minta admin menambahkannya.");document.getElementById("lo2").hidden=false;return}
  gmsg("Memuat data member… (±4 MB, tunggu sebentar)");
  let D;
  const {data:blob,error:de}=await SB.storage.from("data").download(DATA_FILE);
  if(de||!blob){D=emptyData()}else{try{D=JSON.parse(await gunzipText(blob))}catch(x){showGate(false,"Data rusak atau tidak bisa dibaca: "+x.message);return}}
  gate.hidden=true;document.getElementById("root").hidden=false;
  document.getElementById("who").innerHTML=ME.email+" · "+ROLE+' · <a href="#" id="lo">Keluar</a>';
  document.getElementById("lo").onclick=async e=>{e.preventDefault();await SB.auth.signOut();location.reload()};
  boot(D);
}
document.getElementById("lf").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("lb");b.disabled=true;gmsg("Masuk…");
  const {error}=await SB.auth.signInWithPassword({email:document.getElementById("le").value.trim(),password:document.getElementById("lp").value});
  b.disabled=false;if(error){gmsg(error.message==="Invalid login credentials"?"Email atau password salah.":error.message);return}location.reload()};
document.getElementById("lo2").onclick=async()=>{await SB.auth.signOut();location.reload()};
start().catch(e=>showGate(false,"Terjadi kesalahan: "+(e&&e.message||e)));
</script>
</body></html>
